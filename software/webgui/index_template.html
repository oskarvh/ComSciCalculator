<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- START PRELOAD FONTS -->
    <link rel="preload" href="path to .ttf file" as="font" type="font/ttf" crossorigin>
    <!-- END PRELOAD FONTS -->
    <title>Computer Scientists Calculator</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            padding: 0;
            margin: 0;
            pointer-events: none;
            background: rgb(10, 10, 10);
        }
        /* <START IMPORT FONTS> */
        @font-face {
          font-family: 'Name of font';
          font-style: normal;
          font-weight: 400;
          src: url('path to .ttf file') format('truetype');
        }
        /* <END IMPORT FONTS> */

        body > canvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        div, a, img {
            position: absolute;
            box-sizing: border-box;
            -webkit-backface-visibility: hidden;
            pointer-events: none;
        }

        a {
            cursor: pointer;
            pointer-events: all;
        }

        .text {
            pointer-events: all;
            white-space: pre;
        }

        /* TODO special exception for text selection in debug tools */
        [id='2067877626'] > * {
            pointer-events: none !important;
        }
    </style>
</head>
<script type="module" src="clay_module.js"></script>
<body>
</body>
</html>
